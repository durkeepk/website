project:
  type: website
  output-dir: _site
  # Explicit list: never let a stray .qmd elsewhere in the tree be treated
  # as site input.
  render:
    - index.qmd
    - background.qmd
    - research.qmd
    - cv.qmd
    - 404.qmd
  resources:
    - files/**

website:
  title: "Patrick Durkee"
  description: "Patrick Durkee is an Assistant Professor of Psychology at California State University, Fresno, studying personality, emotion, and status hierarchy."
  site-url: "https://www.pdurkee.com"
  favicon: images/favicon.png
  open-graph: true
  navbar:
    title: "Patrick Durkee"
    left:
      - href: background.qmd
        text: Background
      - href: research.qmd
        text: Research
      - href: /personality/
        text: "Open Access Personality Psychology Textbook"
  page-footer:
    center: "&copy; Patrick Durkee"
    border: false

format:
  html:
    # PROTOTYPE (branch theme-editorial-prototype): litera is a quieter base
    # than cosmo, and theme-editorial.scss layers the monograph treatment on
    # top. Remove the two theme-editorial files to return to production.
    theme:
      light: [litera, styles.scss, theme-editorial.scss]
      dark: [litera, styles.scss, dark.scss, theme-editorial.scss, theme-editorial-dark.scss]
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    grid:
      body-width: 820px
