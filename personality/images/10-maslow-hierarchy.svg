<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img"
     aria-labelledby="maslow-title maslow-desc" width="560" height="400">
  <title id="maslow-title">Maslow's Hierarchy of Needs</title>
  <desc id="maslow-desc">A five-level pyramid. From the base upward: Physiological, Security, Belonging, Esteem, Actualization.</desc>

  <!-- Level labels reproduce the text of the original Word SmartArt diagram.
       Bands run base (Physiological) to apex (Actualization). -->

  <g stroke="#ffffff" stroke-width="2">
    <polygon points="76.4,292 483.6,292 520,360 40,360"      fill="#0a5c51"/>
    <polygon points="112.8,224 447.2,224 483.6,292 76.4,292"  fill="#0d6a5d"/>
    <polygon points="149.2,156 410.8,156 447.2,224 112.8,224"  fill="#117769"/>
    <polygon points="185.6,88 374.4,88 410.8,156 149.2,156"    fill="#158374"/>
    <polygon points="222,20 338,20 374.4,88 185.6,88"          fill="#1f8a79"/>
  </g>

  <g font-family="'Source Sans Pro', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">
    <text x="280" y="332">Physiological</text>
    <text x="280" y="264">Security</text>
    <text x="280" y="196">Belonging</text>
    <text x="280" y="128">Esteem</text>
    <text x="280" y="60">Actualization</text>
  </g>
</svg>
