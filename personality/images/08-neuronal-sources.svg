<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 332" role="img" aria-labelledby="neuronal-t neuronal-d" width="772" height="332">
  <title id="neuronal-t">Potential sources of individual differences in neuronal communication</title>
  <desc id="neuronal-d">Twelve boxes listing sources of variation in neuronal communication and computation, the last left open as an ellipsis.</desc>
  <g font-family="'Source Sans Pro', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="16" y="16" width="176" height="92" rx="6" fill="#0a5c51"/>
    <text font-size="13" font-weight="600" fill="#ffffff"><tspan x="104.0" y="58.6">The speed of action</tspan><tspan x="104.0" y="74.5">potential (myelination)</tspan></text>
    <rect x="204" y="16" width="176" height="92" rx="6" fill="#177a6b"/>
    <text font-size="13" font-weight="600" fill="#ffffff"><tspan x="292.0" y="58.6">Amount of</tspan><tspan x="292.0" y="74.5">neurotransmitters released</tspan></text>
    <rect x="392" y="16" width="176" height="92" rx="6" fill="#0a5c51"/>
    <text font-size="13" font-weight="600" fill="#ffffff"><tspan x="480.0" y="50.7">Number of receptors</tspan><tspan x="480.0" y="66.5">available to take up</tspan><tspan x="480.0" y="82.4">neurotransmitters</tspan></text>
    <rect x="580" y="16" width="176" height="92" rx="6" fill="#177a6b"/>
    <text font-size="13" font-weight="600" fill="#ffffff"><tspan x="668.0" y="58.6">Efficiency of postsynaptic</tspan><tspan x="668.0" y="74.5">receptor uptake</tspan></text>
    <rect x="16" y="120" width="176" height="92" rx="6" fill="#0a5c51"/>
    <text font-size="13" font-weight="600" fill="#ffffff"><tspan x="104.0" y="154.7">Enzymes available to get</tspan><tspan x="104.0" y="170.6">rid of excess</tspan><tspan x="104.0" y="186.4">neurotransmitters</tspan></text>
    <rect x="204" y="120" width="176" height="92" rx="6" fill="#177a6b"/>
    <text font-size="13" font-weight="600" fill="#ffffff"><tspan x="292.0" y="162.6">Efficiency of reuptake</tspan><tspan x="292.0" y="178.5">from presynaptic dendrite</tspan></text>
    <rect x="392" y="120" width="176" height="92" rx="6" fill="#0a5c51"/>
    <text font-size="13" font-weight="600" fill="#ffffff"><tspan x="480.0" y="154.7">Neurotransmitter</tspan><tspan x="480.0" y="170.6">production (having more or</tspan><tspan x="480.0" y="186.4">less)</tspan></text>
    <rect x="580" y="120" width="176" height="92" rx="6" fill="#177a6b"/>
    <text font-size="13" font-weight="600" fill="#ffffff"><tspan x="668.0" y="162.6">Size of synaptic cleft</tspan><tspan x="668.0" y="178.5">(space between neurons)</tspan></text>
    <rect x="16" y="224" width="176" height="92" rx="6" fill="#0a5c51"/>
    <text font-size="13" font-weight="600" fill="#ffffff"><tspan x="104.0" y="274.6">Synaptic fluid viscosity</tspan></text>
    <rect x="204" y="224" width="176" height="92" rx="6" fill="#177a6b"/>
    <text font-size="13" font-weight="600" fill="#ffffff"><tspan x="292.0" y="250.8">Number of close</tspan><tspan x="292.0" y="266.6">postsynaptic neurons that</tspan><tspan x="292.0" y="282.5">may accidentally pick up</tspan><tspan x="292.0" y="298.3">floating neurotransmitters</tspan></text>
    <rect x="392" y="224" width="176" height="92" rx="6" fill="#0a5c51"/>
    <text font-size="13" font-weight="600" fill="#ffffff"><tspan x="480.0" y="274.6">Size or number of vesicles</tspan></text>
    <rect x="580" y="224" width="176" height="92" rx="6" fill="#177a6b"/>
    <text font-size="13" font-weight="600" fill="#ffffff"><tspan x="668.0" y="274.6">…</tspan></text>
  </g>
</svg>
