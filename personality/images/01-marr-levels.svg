<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 216" role="img" aria-labelledby="marr-t marr-d" width="432" height="216">
  <title id="marr-t">Marr&#x27;s three levels of analysis</title>
  <desc id="marr-d">Three descending levels: Computational, then Algorithmic, then Implementational.</desc>
  <g font-family="'Source Sans Pro', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="20" width="300" height="52" rx="6" fill="#0a5c51"/>
    <text font-size="16" font-weight="600" fill="#ffffff"><tspan x="170.0" y="51.6">Computational Level</tspan></text>
    <path d="M 294 72 l 13 0 l -13 16 l -13 -16 z" fill="#8fc7bd"/>
    <rect x="66" y="82" width="300" height="52" rx="6" fill="#137062"/>
    <text font-size="16" font-weight="600" fill="#ffffff"><tspan x="216.0" y="113.6">Algorithmic Level</tspan></text>
    <path d="M 340 134 l 13 0 l -13 16 l -13 -16 z" fill="#8fc7bd"/>
    <rect x="112" y="144" width="300" height="52" rx="6" fill="#1f8a79"/>
    <text font-size="16" font-weight="600" fill="#ffffff"><tspan x="262.0" y="175.6">Implementational Level</tspan></text>
  </g>
</svg>
