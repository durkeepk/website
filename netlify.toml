# Netlify build configuration.
#
# Netlify renders the Quarto source itself, so the generated _site/ directory
# is NOT committed to this repository.
#
# We download and run Quarto explicitly rather than using
# @quarto/netlify-plugin-quarto. That plugin (last published 2022) resolves
# releases through the GitHub API and fails here with "HttpError: Not Found".
# An explicit command is also required to override the stale `hugo` build
# command previously configured in this site's Netlify UI settings.
#
# Quarto is unpacked under /tmp, NOT into the repo: `quarto render` scans the
# whole project for inputs, and Quarto's own bundled extension templates
# contain .qmd scaffolds that are not valid Quarto markdown.

[build]
  publish = "_site"
  command = """
    set -e
    echo "Installing Quarto $QUARTO_VERSION"
    mkdir -p /tmp/quarto
    curl -fsSL -o /tmp/quarto.tar.gz "https://github.com/quarto-dev/quarto-cli/releases/download/v$QUARTO_VERSION/quarto-$QUARTO_VERSION-linux-amd64.tar.gz"
    tar -xzf /tmp/quarto.tar.gz -C /tmp/quarto
    export PATH="/tmp/quarto/quarto-$QUARTO_VERSION/bin:$PATH"
    quarto --version
    quarto render
    """

[build.environment]
  # Pin Quarto so CI matches the local toolchain. Bump this deliberately.
  QUARTO_VERSION = "1.6.42"

# ---------------------------------------------------------------------------
# Redirects for URLs that existed on the previous Hugo/Wowchemy site.
# The apex -> www redirect is handled by Netlify's domain settings, not here.
# ---------------------------------------------------------------------------

# The old Wowchemy profile page.
[[redirects]]
  from = "/author/patrick-durkee/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/authors/*"
  to = "/"
  status = 301

# Old publication/listing sections now consolidated onto the research page.
[[redirects]]
  from = "/publication/*"
  to = "/research.html"
  status = 301

[[redirects]]
  from = "/publication-type/*"
  to = "/research.html"
  status = 301

[[redirects]]
  from = "/publication_types/*"
  to = "/research.html"
  status = 301

# Wowchemy demo sections that no longer exist.
[[redirects]]
  from = "/post/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/project/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/talk/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/event/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/courses/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/slides/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/tag/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/tags/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/"
  status = 301

[[redirects]]
