# Netlify build configuration.
#
# Netlify renders the Quarto source itself via the official Quarto build
# plugin (declared here and installed from package.json), so the generated
# _site/ directory is NOT committed to this repository.
#
# See: https://quarto.org/docs/publishing/netlify.html

[build]
  publish = "_site"

[build.environment]
  # Pin Quarto so CI matches the local toolchain. Bump this deliberately.
  QUARTO_VERSION = "1.6.42"

[[plugins]]
  package = "@quarto/netlify-plugin-quarto"

# ---------------------------------------------------------------------------
# Redirects for URLs that existed on the previous Hugo/Wowchemy site.
# The apex -> www redirect is handled by Netlify's domain settings, not here.
# ---------------------------------------------------------------------------

# The old Wowchemy profile page.
[[redirects]]
  from = "/author/patrick-durkee/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/authors/*"
  to = "/"
  status = 301

# Old publication/listing sections now consolidated onto the research page.
[[redirects]]
  from = "/publication/*"
  to = "/research.html"
  status = 301

[[redirects]]
  from = "/publication-type/*"
  to = "/research.html"
  status = 301

[[redirects]]
  from = "/publication_types/*"
  to = "/research.html"
  status = 301

# Wowchemy demo sections that no longer exist.
[[redirects]]
  from = "/post/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/project/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/talk/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/event/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/courses/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/slides/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/tag/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/tags/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/categories/*"
  to = "/"
  status = 301

# The old Wowchemy CMS admin panel.
[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 301

# ---------------------------------------------------------------------------
# Security headers (carried over from the previous site's generated _headers).
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN rather than the old site's DENY: the CV page embeds
    # files/cv/cv.pdf from this same origin, which DENY would block.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
