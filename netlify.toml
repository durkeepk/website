# The old Wowchemy CMS admin panel.
[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 301

# ---------------------------------------------------------------------------
# Security headers (carried over from the previous site's generated _headers).
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN rather than the old site's DENY: the CV page embeds
    # files/cv/cv.pdf from this same origin, which DENY would block.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
